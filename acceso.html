<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Acceso privado · LiveFactSignal</title><style>body{min-height:100vh;margin:0;display:grid;place-items:center;font:16px/1.5 system-ui;background:#0a171c;color:#eafff8}.card{border:1px solid #2b675a;border-radius:16px;background:#102831;padding:32px;max-width:510px;margin:16px}h1{font-size:30px}.sub{color:#c4d8d9;font-size:14px}a{color:#96e8d4}</style></head><body><main class="card"><div style="color:#91efd1;font-size:12px;letter-spacing:.15em">LIVEFACTSIGNAL · SESIÓN DE OPERADOR</div><h1 id="title">Activando tu sesión privada…</h1><p class="sub" id="message">La credencial de administración permanece en Vercel; nunca se escribe en el navegador.</p><p class="sub"><a href="/">Volver a la consola</a></p></main><script>(async()=>{const p=new URLSearchParams(location.search),ticket=p.get('ticket');history.replaceState({},'',location.pathname);if(!ticket){document.querySelector('#title').textContent='Falta el enlace privado';return}try{const r=await fetch('/api/operator-auth?action=redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ticket})});const j=await r.json();if(!r.ok)throw Error(j.error||'Error de autorización');document.querySelector('#title').textContent='Sesión activada';document.querySelector('#message').textContent='Ya puedes entrar a la consola. En adelante solo necesitarás introducir tu clave OpenRouter.';setTimeout(()=>location.replace('/'),900)}catch(e){document.querySelector('#title').textContent='No se ha podido activar';document.querySelector('#message').textContent=e.message+' Solicita un nuevo enlace de acceso.'}})();</script></body></html>
