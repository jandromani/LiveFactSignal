name: Scan verified Congreso speaker MP4 catalog
on:
  push:
    paths:
      - '.github/workflows/voiceprint-speaker-index.yml'
      - 'scripts/voiceprints/scan_speakers.py'
      - 'scripts/voiceprints/sources.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official archive parsers
        run: python -m pip install -q requests beautifulsoup4
      - name: Index exact MP4 downloads by publisher speaker row
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/voiceprints/scan_speakers.py 2>&1 | tee scripts/voiceprints/speaker-index-log.txt
      - name: Commit public metadata only, no biometric data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/voiceprints/speaker-index.json scripts/voiceprints/speaker-index-log.txt || true
          git diff --cached --quiet || git commit -m 'Refresh official Congress speaker-labeled MP4 index'
          git pull --rebase --autostash origin master || { git rebase --abort || true; exit 0; }
          git push origin HEAD:master || true
