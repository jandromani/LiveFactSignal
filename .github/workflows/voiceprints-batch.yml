name: Enroll 10 acoustic references for 12 political debate participants
on:
  push:
    paths:
      - '.github/workflows/voiceprints-batch.yml'
      - 'scripts/voiceprints/batch.py'
      - 'scripts/voiceprints/sources.json'
      - 'scripts/voiceprints/speaker-index.json'
  workflow_dispatch:
concurrency:
  group: voiceprints-enrollment-master
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  enroll:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vetted audio utilities and local speaker model interface
        run: python -m pip install -q numpy soundfile requests beautifulsoup4 sherpa-onnx imageio-ffmpeg yt-dlp
      - name: Validate Python syntax and pinned-source manifest
        run: |
          python -m py_compile scripts/voiceprints/batch.py
          python -m json.tool scripts/voiceprints/sources.json >/dev/null
      - name: Run acoustic quality and publisher attribution checks; import only through GitHub OIDC
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/voiceprints/batch.py 2>&1 | tee scripts/voiceprints/batch-last.txt
      - name: Save audio audit report (metrics only; no embeddings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceprint-qa-${{ github.run_number }}
          path: |
            scripts/voiceprints/batch-report.json
            scripts/voiceprints/batch-last.txt
          if-no-files-found: warn
          retention-days: 14
