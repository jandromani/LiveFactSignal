name: Voiceprint archive access probe
on:
  push:
    paths:
      - '.github/workflows/voiceprint-probe.yml'
      - 'scripts/voiceprints/probe.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media audit dependencies
        run: pip install -q requests beautifulsoup4 yt-dlp
      - name: Probe source pages, playable media and exact CAM++ asset
        run: python -u scripts/voiceprints/probe.py 2>&1 | tee scripts/voiceprints/probe-last.txt
      - name: Save diagnostic to private repository
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/voiceprints/probe-last.txt
          git diff --cached --quiet || git commit -m 'Store voice archive reachability audit'
          git pull --rebase --autostash origin master || { git rebase --abort || true; exit 0; }
          git push origin HEAD:master || true
