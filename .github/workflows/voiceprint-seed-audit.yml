name: Audit all baseline voice sample publisher labels
on:
  push:
    paths:
      - '.github/workflows/voiceprint-seed-audit.yml'
      - 'scripts/voiceprints/audit_seeds.py'
      - 'scripts/voiceprints/sources.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTML verifier
        run: pip install -q requests beautifulsoup4
      - name: Audit source labels on exact downloadable MP4 links
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/voiceprints/audit_seeds.py 2>&1 | tee scripts/voiceprints/seed-audit-last.txt
      - name: Commit only non-biometric audit findings
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/voiceprints/seed-audit-last.txt || true
          git diff --cached --quiet || git commit -m 'Audit publisher identities for 24 baseline voice references'
          git pull --rebase --autostash origin master || { git rebase --abort || true; exit 0; }
          git push origin HEAD:master || true
